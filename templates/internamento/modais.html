{% load static %}
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden" id="modal-nave">
<div class="bg-white w-full max-w-lg rounded-xl shadow-2xl overflow-hidden transform transition-all animate-in fade-in zoom-in-95 duration-200">
<div class="modal-header-acura flex items-center justify-between text-white">
<div class="flex items-center gap-3">
<i class="fa-solid fa-building text-lg"></i>
<h3 class="font-bold text-lg">Nova Nave</h3>
</div>
<button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/10 transition" onclick="closeNaveModal()">
<i class="fa-solid fa-xmark text-lg"></i>
</button>
</div>
<form class="p-6 space-y-5" id="form-nave" onsubmit="submitNave(event)">
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Nome</label>
<input class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" name="nave_nome" placeholder="Ex.: Nave A, Pediatria" required="" type="text"/>
</div>
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Descrição</label>
<input class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" name="nave_descricao" type="text"/>
</div>
<div class="pt-4 flex items-center justify-end gap-3 border-t border-gray-100">
<button class="px-5 py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition" onclick="closeNaveModal()" type="button">
                        Cancelar
                    </button>
<button class="px-6 py-2.5 rounded-xl bg-[#F36A2D] hover:opacity-90 text-white text-sm font-medium transition shadow-sm" type="submit">
                        Guardar
                    </button>
</div>
</form>
</div>
</div>

<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden" id="modal-quarto">
<div class="bg-white w-full max-w-lg rounded-xl shadow-2xl overflow-hidden transform transition-all animate-in fade-in zoom-in-95 duration-200">
<div class="modal-header-acura flex items-center justify-between text-white">
<div class="flex items-center gap-3">
<i class="fa-solid fa-door-closed text-lg"></i>
<h3 class="font-bold text-lg">Novo Quarto</h3>
</div>
<button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/10 transition" onclick="closeQuartoModal()">
<i class="fa-solid fa-xmark text-lg"></i>
</button>
</div>
<form class="p-6 space-y-5" id="form-quarto" onsubmit="submitQuarto(event)">
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Nave</label>
<select class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" name="quarto_nave_id" required="">
<option value="">Seleccione...</option>
{% for n in naves %}
<option value="{{ n.id }}">{{ n.nome }}</option>
{% endfor %}
</select>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Número</label>
<input class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" name="quarto_numero" required="" type="text"/>
</div>
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Tipo</label>
<select class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" name="quarto_tipo" required="">
{% for value, label in quarto_tipos %}
<option value="{{ value }}">{{ label }}</option>
{% endfor %}
</select>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Capacidade (nº de internantes)</label>
<input class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" min="1" name="quarto_capacidade" required="" type="number"/>
</div>
<div class="pt-4 flex items-center justify-end gap-3 border-t border-gray-100">
<button class="px-5 py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition" onclick="closeQuartoModal()" type="button">
                        Cancelar
                    </button>
<button class="px-6 py-2.5 rounded-xl bg-[#F36A2D] hover:opacity-90 text-white text-sm font-medium transition shadow-sm" type="submit">
                        Guardar
                    </button>
</div>
</form>
</div>
</div>

<!-- Modal: Internados (lista + Dar Alta) -->
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden" id="modal-internados">
<div class="bg-white w-full max-w-4xl rounded-xl shadow-2xl overflow-hidden transform transition-all animate-in fade-in zoom-in-95 duration-200">
<div class="modal-header-acura flex items-center justify-between text-white">
<div class="flex items-center gap-3">
<i class="fa-solid fa-bed-pulse text-lg"></i>
<h3 class="font-bold text-lg">Pacientes Internados</h3>
</div>
<button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/10 transition" onclick="closeInternadosModal()">
<i class="fa-solid fa-xmark text-lg"></i>
</button>
</div>
<div class="p-6 max-h-[80vh] overflow-y-auto">
<div class="relative w-full mb-4">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
<i class="fa-solid fa-magnifying-glass text-xs"></i>
</span>
<input class="w-full h-10 pl-10 pr-4 bg-gray-50 border border-gray-200 rounded-full text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="input-search-internados" oninput="filterInternados(this.value)" placeholder="Pesquisar por nome, código ou BI do paciente..." type="text"/>
</div>
<div class="overflow-x-auto">
<table class="w-full text-left border-collapse">
<thead>
<tr class="border-b border-gray-100">
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Paciente</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">BI</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Nave / Quarto</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Médico</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Entrada</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider text-right">Ação</th>
</tr>
</thead>
<tbody class="divide-y divide-gray-50 text-sm text-gray-700" id="internados-body">
<tr><td class="py-6 px-4 text-center text-gray-400" colspan="6">A carregar...</td></tr>
</tbody>
</table>
</div>
</div>
</div>
</div>

<!-- Modal: Nova Requisição de Medicamentos à Farmácia -->
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden" id="modal-requisicao-interna">
<div class="bg-white w-full max-w-2xl rounded-xl shadow-2xl overflow-hidden transform transition-all animate-in fade-in zoom-in-95 duration-200">
<div class="modal-header-acura flex items-center justify-between text-white">
<div class="flex items-center gap-3">
<i class="fa-solid fa-truck-medical text-lg"></i>
<h3 class="font-bold text-lg">Nova Requisição à Farmácia</h3>
</div>
<button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/10 transition" onclick="closeRequisicaoInternaModal()">
<i class="fa-solid fa-xmark text-lg"></i>
</button>
</div>
<form class="p-6 space-y-5 max-h-[80vh] overflow-y-auto" id="form-requisicao-interna" onsubmit="submitRequisicaoInterna(event)">
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Sector de Origem</label>
<input class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" name="requisicao_origem" placeholder="Ex.: Nave A - Enfermaria 3" required="" type="text"/>
</div>

<div id="itens-requisicao-interna" class="space-y-4"></div>

<button class="flex items-center gap-2 text-sm font-medium text-[#F36A2D] hover:underline" onclick="adicionarLinhaRequisicaoInterna()" type="button">
<i class="fa-solid fa-circle-plus"></i> Adicionar medicamento
</button>

<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Observações</label>
<textarea class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" name="requisicao_observacoes" rows="2"></textarea>
</div>

<div class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl p-3" id="modalErroRequisicaoInterna"></div>

<div class="pt-4 flex items-center justify-end gap-3 border-t border-gray-100">
<button class="px-5 py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition" onclick="closeRequisicaoInternaModal()" type="button">
                        Cancelar
                    </button>
<button class="px-6 py-2.5 rounded-xl bg-[#F36A2D] hover:opacity-90 text-white text-sm font-medium transition shadow-sm" type="submit">
                        Enviar à Farmácia
                    </button>
</div>
</form>
</div>
</div>

<!-- Template de linha de medicamento — clonado por JS -->
<template id="template-linha-requisicao-interna">
<div class="grid grid-cols-12 gap-3 items-start border border-gray-200 rounded-xl p-4 linha-requisicao-interna">
<div class="col-span-12 md:col-span-8 space-y-1">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Medicamento</label>
<select class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" name="item_medicamento_id[]" required>
<option value="">Seleccione...</option>
{% for m in medicamentos %}
<option value="{{ m.id }}">{{ m.nome }}{% if m.concentracao %} ({{ m.concentracao }}){% endif %}</option>
{% endfor %}
</select>
</div>
<div class="col-span-8 md:col-span-3 space-y-1">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Quantidade</label>
<input class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" min="1" name="item_quantidade[]" required type="number"/>
</div>
<div class="col-span-4 md:col-span-1 flex items-end justify-end pb-1">
<button class="text-red-500 hover:text-red-700 text-xs" onclick="this.closest('.linha-requisicao-interna').remove()" type="button">
<i class="fa-solid fa-trash-can"></i>
</button>
</div>
</div>
</template>

<!-- Modal: Evolução Clínica (histórico + nova nota) -->
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden" id="modal-evolucao">
<div class="bg-white w-full max-w-2xl rounded-xl shadow-2xl overflow-hidden transform transition-all animate-in fade-in zoom-in-95 duration-200">
<div class="modal-header-acura flex items-center justify-between text-white">
<div class="flex items-center gap-3">
<i class="fa-solid fa-notes-medical text-lg"></i>
<h3 class="font-bold text-lg">Evolução de <span id="evolucao-paciente-nome"></span></h3>
</div>
<button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/10 transition" onclick="closeEvolucaoModal()">
<i class="fa-solid fa-xmark text-lg"></i>
</button>
</div>
<div class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">

<div id="evolucao-timeline" class="space-y-3">
<p class="text-center text-gray-400 py-6">A carregar...</p>
</div>

<div class="pt-2 border-t border-gray-100 space-y-3">
<h4 class="text-xs font-bold text-gray-600 uppercase tracking-wider">Nova Nota</h4>
<div class="grid grid-cols-3 gap-3">
<select class="col-span-1 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" id="evolucao-tipo">
<option value="MEDICA">Evolução Médica</option>
<option value="ENFERMAGEM">Evolução de Enfermagem</option>
<option value="OUTRA">Outra</option>
</select>
<textarea class="col-span-2 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" id="evolucao-texto" placeholder="Descrever a evolução do paciente..." rows="2"></textarea>
</div>
<div class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl p-3" id="modalErroEvolucao"></div>
<div class="flex justify-end">
<button class="px-6 py-2.5 rounded-xl bg-[#F36A2D] hover:opacity-90 text-white text-sm font-medium transition shadow-sm" onclick="submitEvolucao()" type="button">
                        Adicionar Nota
                    </button>
</div>
</div>

</div>
</div>
</div>
