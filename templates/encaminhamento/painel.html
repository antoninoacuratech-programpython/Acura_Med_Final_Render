{% load static %}
<section class="panel" id="encaminhamentosPanel">
<div class="flex-1 flex flex-col h-full bg-[#C4C5E0]">
<div class="grid grid-cols-3 gap-6 mb-8">
<div class="bg-white rounded-2xl p-5 shadow-sm flex items-center justify-between">
<div>
<p class="text-xs text-gray-500 font-medium mb-1">Total Encaminhados</p>
<h3 class="text-2xl font-bold text-gray-800">142</h3>
</div>
<div class="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg shadow-inner">
<i class="fa-solid fa-share-from-square"></i>
</div>
</div>
<div class="bg-white rounded-2xl p-5 shadow-sm flex items-center justify-between">
<div>
<p class="text-xs text-gray-500 font-medium mb-1">Aguardando Especialidade</p>
<h3 class="text-2xl font-bold text-gray-800">18</h3>
</div>
<div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg shadow-inner">
<i class="fa-solid fa-clock-rotate-left"></i>
</div>
</div>
<div class="bg-white rounded-2xl p-5 shadow-sm flex items-center justify-between">
<div>
<p class="text-xs text-gray-500 font-medium mb-1">Concluídos</p>
<h3 class="text-2xl font-bold text-gray-800">124</h3>
</div>
<div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg shadow-inner">
<i class="fa-solid fa-circle-check"></i>
</div>
</div>
</div>
<div class="bg-white rounded-3xl p-6 shadow-sm flex-1 flex flex-col">
<div class="flex items-center justify-between mb-6">
<h3 class="text-lg font-bold text-gray-800">Gestão de Encaminhamentos</h3>
<button class="flex items-center gap-2 bg-[#F36A2D] text-white hover:opacity-90 px-5 py-2 rounded-full font-medium text-sm transition shadow-sm" onclick="openEncaminhamentoModal()">
<i class="fa-solid fa-plus"></i>
<span>Novo Encaminhamento</span>
</button>
</div>
<div class="overflow-x-auto flex-1">
<table class="w-full text-left border-collapse">
<thead>
<tr class="border-b border-gray-100">
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                                        Paciente</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                                        Origem</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                                        Destino / Especialidade</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider text-right">
                                        Estado</th>
</tr>
</thead>
<tbody class="divide-y divide-gray-50 text-sm text-gray-700">
<tr class="hover:bg-gray-50/50 transition">
<td class="py-4 px-4 font-medium">Francisco Antonio</td>
<td class="py-4 px-4 text-gray-500">Consulta Geral</td>
<td class="py-4 px-4 text-gray-700 font-medium">Cardiologia</td>
<td class="py-4 px-4 text-right"><span class="bg-amber-50 text-amber-600 text-xs px-3 py-1 rounded-full font-medium">Pendente</span>
</td>
</tr>
</tbody>
</table>
</div>
</div>
</div>
</section>

{% include 'encaminhamento/modais.html' %}
