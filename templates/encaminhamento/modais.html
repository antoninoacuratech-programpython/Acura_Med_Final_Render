{% load static %}
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden" id="modal-encaminhamento">
<div class="bg-white w-full max-w-4xl rounded-xl shadow-2xl overflow-hidden transform transition-all">
<!-- Modal Header -->
<div class="modal-header-acura flex items-center justify-between text-white">
<div class="flex items-center gap-3">
<i class="fa-solid fa-share-nodes text-lg"></i>
<h3 class="font-bold text-lg">Novo Encaminhamento</h3>
</div>
<button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/10 transition" onclick="closeEncaminhamentoModal()">
<i class="fa-solid fa-xmark text-lg"></i>
</button>
</div>
<!-- Modal Form -->
<form class="p-6 space-y-5 max-h-[80vh] overflow-y-auto" id="form-novo-encaminhamento" onsubmit="submitEncaminhamento(event)">
<!-- Nome do Paciente -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Nome do
                        Paciente</label>
<input class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="enc-paciente" placeholder="Ex: Francisco Antonio" required="" type="text"/>
</div>
<!-- Origem (Setor/Consulta atual) -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Origem / Setor
                        Atual</label>
<select class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="enc-origem">
<option value="Consulta Geral">Consulta Geral</option>
<option value="Triagem">Triagem</option>
<option value="Urgência">Urgência</option>
</select>
</div>
<!-- Destino / Especialidade -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Especialidade /
                        Destino</label>
<select class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="enc-destino">
<option value="Cardiologia">Cardiologia</option>
<option value="Pediatria">Pediatria</option>
<option value="Ortopedia">Ortopedia</option>
<option value="Oftalmologia">Oftalmologia</option>
<option value="Exames Complementares">Exames Complementares</option>
</select>
</div>
<!-- Observações / Motivo -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Motivo do
                        Encaminhamento</label>
<textarea class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="enc-motivo" placeholder="Descreva brevemente a indicação clínica..." rows="3"></textarea>
</div>
<!-- Ações do Modal -->
<div class="pt-4 flex items-center justify-end gap-3 border-t border-gray-100">
<button class="px-5 py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition" onclick="closeEncaminhamentoModal()" type="button">
                        Cancelar
                    </button>
<button class="px-6 py-2.5 rounded-xl bg-[#F36A2D] hover:opacity-90 text-white text-sm font-medium transition shadow-sm" type="submit">
                        Registar Encaminhamento
                    </button>
</div>
</form>
</div>
</div>
