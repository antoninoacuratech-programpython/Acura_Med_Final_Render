{% load static %}
<div id="modalPermissao" class="hidden fixed inset-0 z-[100] flex items-center justify-center
           bg-black/50 backdrop-blur-sm p-0 sm:p-4">

    <div class="relative w-full h-full sm:h-auto sm:max-w-lg sm:max-h-[95vh]
               overflow-hidden bg-white sm:rounded-2xl shadow-2xl flex flex-col">

        <div class="flex items-center justify-between px-4 sm:px-6 py-4 border-b border-gray-100 shrink-0">
            <div>
                <h2 id="modalPermissaoTitulo" class="text-lg sm:text-xl font-semibold text-gray-800">Nova Permissão</h2>
                <p class="text-sm text-gray-500 mt-1">Define uma ação que pode ser atribuída a um perfil.</p>
            </div>
            <button type="button" onclick="fecharModalPermissao()"
                    class="w-9 h-9 flex items-center justify-center rounded-lg text-gray-400
                           hover:bg-gray-100 hover:text-gray-700 transition shrink-0">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <div class="overflow-y-auto flex-1 px-4 sm:px-6 py-6">

            <p id="modalPermissaoErro" class="text-red-500 text-sm mb-4 hidden"></p>

            <form id="formPermissao" method="POST"
                  data-url-criar="{% url 'cadastrar_permissao' %}"
                  data-url-atualizar-template="{% url 'atualizar_permissao' 999999999 %}"
                  action="{% url 'cadastrar_permissao' %}"
                  onsubmit="submitPermissao(event)" class="space-y-4">

                {% csrf_token %}
                <input type="hidden" id="permissao_id" name="permissao_id" value="">

                <div>
                    <label for="permissao_nome" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Nome <span class="text-red-500">*</span>
                    </label>
                    <input id="permissao_nome" name="permissao_nome" type="text" required
                           placeholder="Ex.: Cadastrar Paciente"
                           class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                  outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                </div>

                <div>
                    <label for="permissao_codigo" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Código <span class="text-red-500">*</span>
                    </label>
                    <input id="permissao_codigo" name="permissao_codigo" type="text" required
                           placeholder="Ex.: paciente.cadastrar" autocomplete="off"
                           class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800 font-mono
                                  outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                    <p class="text-xs text-gray-400 mt-1">Convenção: "modulo.acao", ex. paciente.eliminar</p>
                </div>

                <div>
                    <label for="permissao_descricao" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Descrição
                    </label>
                    <textarea id="permissao_descricao" name="permissao_descricao" rows="2"
                              placeholder="Opcional"
                              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                     outline-none resize-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition"></textarea>
                </div>

                <label class="flex items-center gap-2 cursor-pointer w-fit">
                    <input type="checkbox" id="permissao_ativo" name="permissao_ativo" checked
                           class="w-4 h-4 rounded border-gray-300 text-orange-500 focus:ring-orange-400">
                    <span class="text-sm text-gray-700">Permissão ativa</span>
                </label>

                <div class="flex flex-col-reverse sm:flex-row sm:justify-end items-stretch sm:items-center
                            gap-3 pt-5 border-t border-gray-100">
                    <button type="button" onclick="fecharModalPermissao()"
                            class="w-full sm:w-auto px-5 py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium
                                   hover:bg-gray-50 transition">
                        Cancelar
                    </button>
                    <button type="submit" id="btnSalvarPermissao"
                            class="flex items-center gap-2 bg-[#F36A2D] text-white hover:opacity-90 px-5 py-2 rounded-full font-medium text-sm transition shadow-sm">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span id="btnSalvarPermissaoTexto">Criar Permissão</span>
                    </button>
                </div>

            </form>
        </div>

    </div>
</div>
