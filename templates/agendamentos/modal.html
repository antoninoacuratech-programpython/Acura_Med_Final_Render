<!-- Overlay + Modal: Cadastrar/Editar Agendamento -->
<div id="modalAgendamento" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div id="overlayAgendamento" class="absolute inset-0 bg-primary-dark/50 backdrop-blur-sm"></div>

    <div class="relative w-full max-w-2xl bg-card rounded-3xl shadow-xl border border-gray-100 max-h-[90vh] overflow-y-auto">

        <div class="flex items-center justify-between px-8 pt-8 pb-4 sticky top-0 bg-card z-10">
            <div>
                <h2 id="modalAgendamentoTitulo" class="text-lg font-semibold text-text-main">Novo Agendamento</h2>
                <p class="text-xs text-gray-400 mt-0.5">Preencha os dados da consulta.</p>
            </div>
            <button type="button" id="btnFecharModalAgendamento"
                class="w-9 h-9 rounded-full flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-all cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form id="formAgendamento" class="px-8 pb-8" novalidate>
            {% csrf_token %}
            <input type="hidden" name="agendamento_id" id="agendamentoId" value="">

            <div id="erroAgendamento" class="hidden mb-5 text-xs text-red-600 bg-red-50 border border-red-100 rounded-xl px-4 py-3"></div>

            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Participantes</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Paciente</label>
                    <select name="paciente" id="pacienteSelect" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm bg-card">
                        <option value="">Selecione...</option>
                        {% for paciente in pacientes %}
                        <option value="{{ paciente.id }}">{{ paciente }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Profissional</label>
                    <select name="profissional" id="profissionalSelect" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm bg-card">
                        <option value="">Selecione...</option>
                        {% for profissional in profissionais %}
                        <option value="{{ profissional.id }}">{{ profissional.nome_completo }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Local</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Departamento</label>
                    <select name="departamento" id="departamentoSelect"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm bg-card">
                        <option value="">Selecione...</option>
                        {% for departamento in departamentos %}
                        <option value="{{ departamento.id }}">{{ departamento.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Especialidade</label>
                    <select name="especialidade" id="especialidadeSelect"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm bg-card">
                        <option value="">Selecione...</option>
                        {% for especialidade in especialidades %}
                        <option value="{{ especialidade.id }}">{{ especialidade.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Consulta</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Data e Hora</label>
                    <input type="datetime-local" name="data_hora" id="dataHora" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Duração (min)</label>
                    <input type="number" name="duracao_minutos" id="duracaoMinutos" min="5" step="5" value="30" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                    <select name="status" id="statusSelect"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm bg-card">
                        {% for valor, rotulo in status_choices %}
                        <option value="{{ valor }}">{{ rotulo }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Motivo</label>
                    <input type="text" name="motivo" id="motivo" required placeholder="Ex.: Consulta de rotina"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm">
                </div>
            </div>

            <div class="mb-8">
                <label class="block text-sm font-medium text-gray-700 mb-1">Observações</label>
                <textarea name="observacoes" id="observacoes" rows="3"
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm resize-none"></textarea>
            </div>

            <div class="flex items-center justify-end gap-3 pt-2 border-t border-gray-100">
                <button type="button" id="btnCancelarAgendamento"
                    class="px-5 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-100 transition-all cursor-pointer">
                    Cancelar
                </button>
                <button type="submit" id="btnSalvarAgendamento"
                    class="px-6 py-3 rounded-xl bg-orange text-white text-sm font-medium shadow-md transition-all cursor-pointer inline-flex items-center gap-2 hover:opacity-90">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span id="btnSalvarAgendamentoTexto">Criar Agendamento</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Confirmação de eliminação -->
<div id="modalConfirmarEliminarAgendamento" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div id="overlayConfirmarEliminarAgendamento" class="absolute inset-0 bg-primary-dark/50 backdrop-blur-sm"></div>

    <div class="relative w-full max-w-sm bg-card rounded-3xl shadow-xl border border-gray-100 p-8 text-center">
        <div class="w-14 h-14 rounded-full bg-red-50 text-red-500 flex items-center justify-center mx-auto mb-5">
            <i class="fa-solid fa-triangle-exclamation text-xl"></i>
        </div>
        <h3 class="text-base font-semibold text-text-main mb-1">Eliminar agendamento?</h3>
        <p class="text-sm text-gray-500 mb-6">
            Tem certeza que deseja eliminar <strong id="descricaoAgendamentoEliminar" class="text-text-main"></strong>?
            Esta ação não pode ser desfeita.
        </p>
        <div class="flex items-center justify-center gap-3">
            <button type="button" id="btnCancelarEliminarAgendamento"
                class="px-5 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-100 transition-all cursor-pointer">
                Cancelar
            </button>
            <button type="button" id="btnConfirmarEliminarAgendamento"
                class="px-5 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white text-sm font-medium shadow-md transition-all cursor-pointer">
                Sim, eliminar
            </button>
        </div>
    </div>
</div>
