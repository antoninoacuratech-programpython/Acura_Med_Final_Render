{% load static %}
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden" id="modal-sinais-vitais">
<div class="bg-white w-full max-w-xl rounded-xl shadow-2xl overflow-hidden transform transition-all animate-in fade-in zoom-in-95 duration-200">
<div class="modal-header-acura flex items-center justify-between text-white">
<div class="flex items-center gap-3">
<i class="fa-solid fa-heart-pulse text-lg"></i>
<h3 class="font-bold text-lg">Sinais Vitais — <span id="sv-paciente-nome"></span></h3>
</div>
<button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/10 transition" onclick="closeSinaisVitaisModal()">
<i class="fa-solid fa-xmark text-lg"></i>
</button>
</div>
<form class="p-6 space-y-4" id="form-sinais-vitais" onsubmit="submitSinaisVitais(event)">
<input id="sv-atendimento-id" name="atendimento_id" type="hidden" value=""/>

<div class="grid grid-cols-3 gap-4 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm">
<div>
<p class="text-xs text-gray-400">Nome</p>
<p class="font-semibold text-gray-800" id="sv-info-nome">—</p>
</div>
<div>
<p class="text-xs text-gray-400">Nº do BI</p>
<p class="font-semibold text-gray-800" id="sv-info-bi">—</p>
</div>
<div>
<p class="text-xs text-gray-400">Idade</p>
<p class="font-semibold text-gray-800" id="sv-info-idade">—</p>
</div>
</div>

<div class="grid grid-cols-2 gap-4">
<div class="space-y-1">
<label class="block text-xs font-semibold text-gray-600 uppercase">Pressão Arterial (mmHg)</label>
<input class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#F36A2D]" name="pressao_arterial" placeholder="120/80" type="text"/>
</div>
<div class="space-y-1">
<label class="block text-xs font-semibold text-gray-600 uppercase">Freq. Cardíaca (bpm)</label>
<input class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#F36A2D]" name="frequencia_cardiaca" type="number"/>
</div>
<div class="space-y-1">
<label class="block text-xs font-semibold text-gray-600 uppercase">Freq. Respiratória (irpm)</label>
<input class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#F36A2D]" name="frequencia_respiratoria" type="number"/>
</div>
<div class="space-y-1">
<label class="block text-xs font-semibold text-gray-600 uppercase">Temperatura (°C)</label>
<input class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#F36A2D]" name="temperatura" step="0.1" type="number"/>
</div>
<div class="space-y-1">
<label class="block text-xs font-semibold text-gray-600 uppercase">Saturação O2 (%)</label>
<input class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#F36A2D]" name="saturacao_o2" type="number"/>
</div>
<div class="space-y-1">
<label class="block text-xs font-semibold text-gray-600 uppercase">Glicemia Capilar (mg/dL)</label>
<input class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#F36A2D]" name="glicemia_capilar" type="number"/>
</div>
</div>
<div class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl p-3" id="modalErroSinaisVitais"></div>
<div class="pt-2 flex items-center justify-end gap-3 border-t border-gray-100">
<button class="px-5 py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition" onclick="closeSinaisVitaisModal()" type="button">
                        Cancelar
                    </button>
<button class="px-6 py-2.5 rounded-xl bg-[#F36A2D] hover:opacity-90 text-white text-sm font-medium transition shadow-sm" type="submit">
                        Guardar
                    </button>
</div>
</form>
</div>
</div>
