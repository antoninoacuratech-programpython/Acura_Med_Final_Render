{% load static %}
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden" id="modal-prescricao">
<div class="bg-white w-full max-w-3xl rounded-xl shadow-2xl overflow-hidden transform transition-all animate-in fade-in zoom-in-95 duration-200">
<div class="modal-header-acura flex items-center justify-between text-white">
<div class="flex items-center gap-3">
<i class="fa-solid fa-file-prescription text-lg"></i>
<h3 class="font-bold text-lg">Prescrever para <span id="prescricao-paciente-nome"></span></h3>
</div>
<button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/10 transition" onclick="closePrescricaoModal()">
<i class="fa-solid fa-xmark text-lg"></i>
</button>
</div>

<form class="p-6 space-y-5 max-h-[80vh] overflow-y-auto" id="form-prescricao" onsubmit="submitPrescricao(event)">
<input id="prescricao-atendimento-id" name="prescricao_atendimento_id" type="hidden" value=""/>

<div id="itens-prescricao" class="space-y-4"></div>

<button class="flex items-center gap-2 text-sm font-medium text-[#F36A2D] hover:underline" onclick="adicionarLinhaPrescricao()" type="button">
<i class="fa-solid fa-circle-plus"></i> Adicionar medicamento
</button>

<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Observações</label>
<textarea class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" name="prescricao_observacoes" rows="2"></textarea>
</div>

<div class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl p-3" id="modalErroPrescricao"></div>

<div class="pt-4 flex items-center justify-end gap-3 border-t border-gray-100">
<button class="px-5 py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition" onclick="closePrescricaoModal()" type="button">
                        Cancelar
                    </button>
<button class="px-6 py-2.5 rounded-xl bg-[#F36A2D] hover:opacity-90 text-white text-sm font-medium transition shadow-sm" id="btnEnviarPrescricao" type="submit">
                        Enviar à Farmácia
                    </button>
</div>
</form>
</div>
</div>

<!-- Template de uma linha de medicamento — clonado por JS, nunca renderizado directamente -->
<template id="template-linha-prescricao">
<div class="grid grid-cols-12 gap-3 items-start border border-gray-200 rounded-xl p-4 linha-prescricao">
<div class="col-span-12 md:col-span-4 space-y-1">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Medicamento</label>
<select class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" name="item_medicamento_id[]" required>
<option value="">Seleccione...</option>
{% for m in medicamentos %}
<option value="{{ m.id }}">{{ m.nome }}{% if m.concentracao %} ({{ m.concentracao }}){% endif %}</option>
{% endfor %}
</select>
</div>
<div class="col-span-6 md:col-span-2 space-y-1">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Dosagem</label>
<input class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" name="item_dosagem[]" placeholder="500mg" type="text"/>
</div>
<div class="col-span-6 md:col-span-2 space-y-1">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Via</label>
<select class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" name="item_via[]">
<option value="ORAL">Oral</option>
<option value="INTRAVENOSA">Intravenosa</option>
<option value="INTRAMUSCULAR">Intramuscular</option>
<option value="SUBCUTANEA">Subcutânea</option>
<option value="TOPICA">Tópica</option>
<option value="INALATORIA">Inalatória</option>
<option value="RECTAL">Rectal</option>
<option value="OUTRA">Outra</option>
</select>
</div>
<div class="col-span-6 md:col-span-2 space-y-1">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Frequência</label>
<input class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" name="item_frequencia[]" placeholder="8/8h" type="text"/>
</div>
<div class="col-span-4 md:col-span-1 space-y-1">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Dias</label>
<input class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" min="1" name="item_duracao_dias[]" type="number"/>
</div>
<div class="col-span-6 md:col-span-1 space-y-1">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Qtd *</label>
<input class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm" min="1" name="item_quantidade[]" required type="number"/>
</div>
<div class="col-span-2 md:col-span-12 flex justify-end">
<button class="text-red-500 hover:text-red-700 text-xs" onclick="this.closest('.linha-prescricao').remove()" type="button">
<i class="fa-solid fa-trash-can"></i> Remover
</button>
</div>
</div>
</template>
