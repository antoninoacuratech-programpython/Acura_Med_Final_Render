<!-- Overlay + Modal: Cadastrar/Editar Utilizador -->
<div id="modalUtilizador" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div id="overlayUtilizador" class="absolute inset-0 bg-primary-dark/50 backdrop-blur-sm"></div>

    <div class="relative w-full max-w-2xl bg-card rounded-3xl shadow-xl border border-gray-100 max-h-[90vh] overflow-y-auto">

        <div class="flex items-center justify-between px-8 pt-8 pb-4 sticky top-0 bg-card z-10">
            <div>
                <h2 id="modalUtilizadorTitulo" class="text-lg font-semibold text-text-main">Novo Utilizador</h2>
                <p class="text-xs text-gray-400 mt-0.5">Preencha os dados do colaborador.</p>
            </div>
            <button type="button" id="btnFecharModalUtilizador"
                class="w-9 h-9 rounded-full flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-all cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form id="formUtilizador" class="px-8 pb-8" novalidate>
            {% csrf_token %}
            <input type="hidden" name="utilizador_id" id="utilizadorId" value="">

            <div id="erroUtilizador" class="hidden mb-5 text-xs text-red-600 bg-red-50 border border-red-100 rounded-xl px-4 py-3"></div>

            <!-- Dados pessoais -->
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Dados Pessoais</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Primeiro Nome</label>
                    <input type="text" name="primeiro_nome" id="primeiroNome" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Apelido</label>
                    <input type="text" name="ultimo_nome" id="ultimoNome" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" name="email" id="utilizadorEmail" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
                    <input type="text" name="telefone" id="telefone"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Cargo</label>
                    <input type="text" name="cargo" id="cargo"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fotografia</label>
                    <input type="file" name="fotografia" id="fotografia" accept="image/*"
                        class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-orange/10 file:text-orange file:text-xs file:font-medium">
                </div>
            </div>

            <!-- Vínculo institucional -->
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Vínculo Institucional</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Hospital</label>
                    <select name="hospital" id="hospitalSelect"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm bg-card">
                        <option value="">Selecione...</option>
                        {% for hospital in hospitais %}
                        <option value="{{ hospital.id }}">{{ hospital.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Perfil</label>
                    <select name="perfil" id="perfilSelect"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm bg-card">
                        <option value="">Selecione...</option>
                        {% for perfil in perfis %}
                        <option value="{{ perfil.id }}">{{ perfil.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Departamento</label>
                    <select name="departamento" id="departamentoSelect"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm bg-card">
                        <option value="">Selecione...</option>
                        {% for departamento in departamentos %}
                        <option value="{{ departamento.id }}">{{ departamento.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Especialidade</label>
                    <select name="especialidade" id="especialidadeSelect"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm bg-card">
                        <option value="">Selecione...</option>
                        {% for especialidade in especialidades %}
                        <option value="{{ especialidade.id }}">{{ especialidade.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Acesso -->
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Acesso</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-2">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" id="labelSenha">Senha</label>
                    <div class="relative flex items-center">
                        <i class="fa-solid fa-lock absolute left-4 text-gray-400 text-xs"></i>
                        <input type="password" name="senha" id="senha" placeholder="Insira a senha"
                            class="w-full pl-10 pr-11 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm">
                        <i class="fa-solid fa-eye toggle-password absolute right-4 text-gray-400 cursor-pointer hover:text-gray-600 text-xs"></i>
                    </div>
                    <p id="dicaSenha" class="text-[11px] text-gray-400 mt-1 hidden">Deixe em branco para manter a senha atual.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar Senha</label>
                    <div class="relative flex items-center">
                        <i class="fa-solid fa-lock absolute left-4 text-gray-400 text-xs"></i>
                        <input type="password" name="confirmar_senha" id="confirmarSenha" placeholder="Confirme a senha"
                            class="w-full pl-10 pr-11 py-3 rounded-xl border border-gray-200 focus:border-orange focus:ring-2 focus:ring-orange/20 outline-none transition-all text-sm">
                        <i class="fa-solid fa-eye toggle-password absolute right-4 text-gray-400 cursor-pointer hover:text-gray-600 text-xs"></i>
                    </div>
                </div>
            </div>

            <label class="flex items-center gap-2.5 mt-4 mb-8 cursor-pointer select-none w-fit">
                <input type="checkbox" name="is_active" id="isActive" checked class="peer sr-only">
                <span class="w-10 h-6 rounded-full bg-gray-200 peer-checked:bg-orange transition-all relative
                    after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-5 after:h-5 after:bg-white after:rounded-full after:transition-all peer-checked:after:translate-x-4"></span>
                <span class="text-sm text-gray-700">Conta ativa</span>
            </label>

            <div class="flex items-center justify-end gap-3 pt-2 border-t border-gray-100">
                <button type="button" id="btnCancelarUtilizador"
                    class="px-5 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-100 transition-all cursor-pointer">
                    Cancelar
                </button>
                <button type="submit" id="btnSalvarUtilizador"
                    class="px-6 py-3 rounded-xl bg-orange text-white text-sm font-medium shadow-md transition-all cursor-pointer inline-flex items-center gap-2 hover:opacity-90">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span id="btnSalvarUtilizadorTexto">Criar Utilizador</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Confirmação de eliminação -->
<div id="modalConfirmarEliminar" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div id="overlayConfirmarEliminar" class="absolute inset-0 bg-primary-dark/50 backdrop-blur-sm"></div>

    <div class="relative w-full max-w-sm bg-card rounded-3xl shadow-xl border border-gray-100 p-8 text-center">
        <div class="w-14 h-14 rounded-full bg-red-50 text-red-500 flex items-center justify-center mx-auto mb-5">
            <i class="fa-solid fa-triangle-exclamation text-xl"></i>
        </div>
        <h3 class="text-base font-semibold text-text-main mb-1">Eliminar utilizador?</h3>
        <p class="text-sm text-gray-500 mb-6">
            Tem certeza que deseja eliminar <strong id="nomeUtilizadorEliminar" class="text-text-main"></strong>?
            Esta ação não pode ser desfeita — considere desativar em vez de eliminar.
        </p>
        <div class="flex items-center justify-center gap-3">
            <button type="button" id="btnCancelarEliminar"
                class="px-5 py-3 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-100 transition-all cursor-pointer">
                Cancelar
            </button>
            <button type="button" id="btnConfirmarEliminar"
                class="px-5 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white text-sm font-medium shadow-md transition-all cursor-pointer">
                Sim, eliminar
            </button>
        </div>
    </div>
</div>
