{% load static %}
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden" id="modal-exame">
<div class="bg-white w-full max-w-3xl rounded-xl shadow-2xl overflow-hidden transform transition-all animate-in fade-in zoom-in-95 duration-200">
<div class="modal-header-acura flex items-center justify-between text-white">
<div class="flex items-center gap-3">
<i class="fa-solid fa-flask-vial text-lg"></i>
<h3 class="font-bold text-lg" id="titulo-modal-exame">Novo Tipo de Exame</h3>
</div>
<button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/10 transition" onclick="closeExameModal()">
<i class="fa-solid fa-xmark text-lg"></i>
</button>
</div>
<form class="p-6 space-y-5 max-h-[80vh] overflow-y-auto" id="form-exame" onsubmit="submitExame(event)">
<input id="exame-id-input" name="exame_id" type="hidden" value=""/>

<div class="flex items-center gap-2 mb-1">
<span class="w-6 h-6 rounded-full bg-[#2D3250] text-white text-xs font-bold flex items-center justify-center">1</span>
<h4 class="text-xs font-bold text-gray-600 uppercase tracking-wider">Identificação</h4>
</div>

<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Código Interno *</label>
<input class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="exame-codigo" name="exame_codigo" required="" type="text"/>
</div>
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Departamento *</label>
<select class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="exame-departamento" name="exame_departamento" required="">
<option value="">Seleccione...</option>
{% for value, label in exame_departamentos %}
<option value="{{ value }}">{{ label }}</option>
{% endfor %}
</select>
</div>
</div>

<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Código Padronizado</label>
<input class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="exame-codigo-padronizado" name="exame_codigo_padronizado" placeholder="Ex.: código LOINC, quando aplicável" type="text"/>
</div>

<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Nome do Exame *</label>
<input class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="exame-nome" name="exame_nome" required="" type="text"/>
</div>

<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Nome Técnico</label>
<input class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="exame-nome-tecnico" name="exame_nome_tecnico" type="text"/>
</div>

<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Método</label>
<select class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="exame-metodo" name="exame_metodo">
<option value="">Não especificado</option>
{% for value, label in exame_metodos %}
<option value="{{ value }}">{{ label }}</option>
{% endfor %}
</select>
</div>
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Tipo de Amostra *</label>
<select class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="exame-tipo-amostra" name="exame_tipo_amostra" required="">
<option value="">Seleccione...</option>
{% for value, label in exame_tipos_amostra %}
<option value="{{ value }}">{{ label }}</option>
{% endfor %}
</select>
</div>
</div>

<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Tipo de Resultado * <span class="text-gray-400 font-normal normal-case">(define os campos de lançamento)</span></label>
<select class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="exame-tipo-resultado" name="exame_tipo_resultado" required="">
<option value="">Seleccione...</option>
{% for value, label in exame_tipos_resultado %}
<option value="{{ value }}">{{ label }}</option>
{% endfor %}
</select>
</div>
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Tempo de Resultado (TAT)</label>
<input class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="exame-tempo-estimado" name="exame_tempo_estimado" placeholder="Ex.: 24 horas" type="text"/>
</div>
</div>

<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Valor de Referência</label>
<input class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="exame-valor-referencia" name="exame_valor_referencia" placeholder="Ex.: 4.5 - 11.0" type="text"/>
</div>
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Unidade de Medida</label>
<input class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="exame-unidade-medida" name="exame_unidade_medida" placeholder="Ex.: mg/dL" type="text"/>
</div>
</div>

<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Instruções de Preparação</label>
<textarea class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="exame-instrucoes-preparacao" name="exame_instrucoes_preparacao" placeholder="Instruções para o paciente antes da colheita..." rows="3"></textarea>
</div>

<label class="hidden items-center gap-2 p-3 border border-gray-200 rounded-xl cursor-pointer" id="exame-ativo-wrapper">
<input class="text-[#F36A2D] focus:ring-[#F36A2D] rounded" id="exame-ativo" name="exame_ativo" type="checkbox"/>
<span class="text-sm font-medium text-gray-700">Activo</span>
</label>

<div class="pt-4 flex items-center justify-end gap-3 border-t border-gray-100">
<button class="px-5 py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition" onclick="closeExameModal()" type="button">
                        Cancelar
                    </button>
<button class="px-6 py-2.5 rounded-xl bg-[#F36A2D] hover:opacity-90 text-white text-sm font-medium transition shadow-sm" type="submit">
                        Guardar
                    </button>
</div>
</form>
</div>
</div>

<!-- Modal: Fila de Solicitações -->
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden" id="modal-solicitacoes">
<div class="bg-white w-full max-w-3xl rounded-xl shadow-2xl overflow-hidden transform transition-all animate-in fade-in zoom-in-95 duration-200">
<div class="modal-header-acura flex items-center justify-between text-white">
<div class="flex items-center gap-3">
<i class="fa-solid fa-vial-circle-check text-lg"></i>
<h3 class="font-bold text-lg">Solicitações de Exame</h3>
</div>
<button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/10 transition" onclick="closeSolicitacoesModal()">
<i class="fa-solid fa-xmark text-lg"></i>
</button>
</div>
<div class="p-6 max-h-[80vh] overflow-y-auto">
<div class="relative w-full mb-4">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
<i class="fa-solid fa-magnifying-glass text-xs"></i>
</span>
<input class="w-full h-10 pl-10 pr-4 bg-gray-50 border border-gray-200 rounded-full text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="input-search-solicitacoes" oninput="filterSolicitacoes(this.value)" placeholder="Pesquisar por nome ou código do paciente..." type="text"/>
</div>
<div class="overflow-x-auto">
<table class="w-full text-left border-collapse">
<thead>
<tr class="border-b border-gray-100">
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Paciente</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Médico</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Exames</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Estado</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Recebida em</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider text-right">Ação</th>
</tr>
</thead>
<tbody class="divide-y divide-gray-50 text-sm text-gray-700" id="solicitacoes-body">
<tr><td class="py-6 px-4 text-center text-gray-400" colspan="6">A carregar...</td></tr>
</tbody>
</table>
</div>
</div>
</div>
</div>

<!-- Modal: Detalhe da Solicitação (colheita + resultados) -->
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden" id="modal-detalhe-solicitacao">
<div class="bg-white w-full max-w-3xl rounded-xl shadow-2xl overflow-hidden transform transition-all animate-in fade-in zoom-in-95 duration-200">
<div class="modal-header-acura flex items-center justify-between text-white">
<div class="flex items-center gap-3">
<i class="fa-solid fa-vial-circle-check text-lg"></i>
<h3 class="font-bold text-lg">Solicitação de <span id="solicitacao-paciente-nome"></span></h3>
</div>
<button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/10 transition" onclick="closeDetalheSolicitacaoModal()">
<i class="fa-solid fa-xmark text-lg"></i>
</button>
</div>
<div class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
<div class="grid grid-cols-3 gap-4 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm">
<div>
<p class="text-xs text-gray-400">Paciente</p>
<p class="font-semibold text-gray-800" id="solicitacao-info-paciente">—</p>
</div>
<div>
<p class="text-xs text-gray-400">Médico</p>
<p class="font-semibold text-gray-800" id="solicitacao-info-medico">—</p>
</div>
<div>
<p class="text-xs text-gray-400">Estado</p>
<p class="font-semibold text-gray-800" id="solicitacao-info-estado">—</p>
</div>
</div>

<div class="space-y-4" id="solicitacao-itens-container"></div>

<div class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl p-3" id="modalErroSolicitacao"></div>

<div class="pt-2 flex items-center justify-between border-t border-gray-100">
<button class="px-5 py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition" onclick="registarColheita()" type="button">
<i class="fa-solid fa-vial mr-1"></i> Registar Colheita
</button>
<button class="px-6 py-2.5 rounded-xl bg-[#F36A2D] hover:opacity-90 text-white text-sm font-medium transition shadow-sm" onclick="concluirSolicitacao()" type="button">
                        Guardar Resultados e Concluir
                    </button>
</div>
</div>
</div>
</div>
