{% load static %}

<!-- ========================================================= -->
<!-- MODAL - CADASTRO / EDIÇÃO DE PACIENTE -->
<!-- ========================================================= -->

<div
    id="modalPaciente"
    class="hidden fixed inset-0 z-[100] flex items-center justify-center
           bg-black/50 backdrop-blur-sm p-0 sm:p-4">

    <div
        class="relative w-full h-full sm:h-auto sm:max-w-4xl sm:max-h-[95vh]
               overflow-hidden bg-white sm:rounded-2xl shadow-2xl
               flex flex-col">

        <!-- ================================================= -->
        <!-- CABEÇALHO -->
        <!-- ================================================= -->

        <div class="flex items-center justify-between px-4 sm:px-6 py-4 border-b border-gray-100 shrink-0">

            <div>
                <h2 id="modalPacienteTitulo" class="text-lg sm:text-xl font-semibold text-gray-800">Novo Paciente</h2>
                <p id="modalPacienteSubtitulo" class="text-sm text-gray-500 mt-1">Registe os dados do paciente no sistema.</p>
            </div>

            <button
                type="button"
                onclick="fecharModal()"
                class="w-9 h-9 flex items-center justify-center rounded-lg text-gray-400
                       hover:bg-gray-100 hover:text-gray-700 transition shrink-0">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

        </div>

        <!-- ================================================= -->
        <!-- ABAS -->
        <!-- ================================================= -->

        <div class="px-4 sm:px-6 pt-4 shrink-0">
            <div class="relative flex items-center gap-6 sm:gap-8 border-b border-gray-100 overflow-x-auto">

                <button type="button" id="btnTabPaciente" onclick="mudarAba('paciente')"
                        class="text-base sm:text-xl font-semibold text-orange-500 transition-colors cursor-pointer pb-3 whitespace-nowrap">
                    Paciente
                </button>

                <button type="button" id="btnTabResponsavel" onclick="mudarAba('responsavel')"
                        class="text-base sm:text-xl font-medium text-gray-400 transition-colors cursor-pointer pb-3 whitespace-nowrap">
                    Responsável
                </button>

                <span id="tabIndicator"
                      class="absolute bottom-0 left-0 h-0.5 bg-orange-500 transition-all duration-300"
                      style="width:70px;">
                </span>

            </div>
        </div>

        <!-- ================================================= -->
        <!-- CONTEÚDO -->
        <!-- ================================================= -->

        <div class="overflow-y-auto flex-1 px-4 sm:px-6 py-6">

            <p id="modalErro" class="text-red-500 text-sm mb-4 hidden"></p>

            <form
                id="formCadastroPaciente"
                method="POST"
                enctype="multipart/form-data"
                data-url-criar="{% url 'cadastrar_paciente' %}"
                data-url-atualizar-template="{% url 'atualizar_paciente' 'CODIGOPLACEHOLDER' %}"
                action="{% url 'cadastrar_paciente' %}"
                onsubmit="submitPaciente(event)" class="space-y-8">

                {% csrf_token %}

                <!-- Preenchido pelo JS quando o modal é aberto em modo edição.
                     Vazio = modo criação. -->
                <input type="hidden" id="paciente_codigo" name="paciente_codigo" value="">

                <!-- ============================================= -->
                <!-- ABA: PACIENTE -->
                <!-- ============================================= -->

                <div id="formPaciente" class="space-y-8">

                    <!-- ---------- DADOS PESSOAIS ---------- -->
                    <div>
                        <h3 class="text-base font-semibold text-gray-800 mb-4">Dados pessoais</h3>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5">

                            <div>
                                <label for="paciente_primeiro_nome" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Primeiro Nome <span class="text-red-500">*</span>
                                </label>
                                <input id="paciente_primeiro_nome" name="paciente_primeiro_nome" type="text" required
                                       autocomplete="given-name" placeholder="Ex.: João"
                                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                              outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                            </div>

                            <div>
                                <label for="paciente_ultimo_nome" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Apelido <span class="text-red-500">*</span>
                                </label>
                                <input id="paciente_ultimo_nome" name="paciente_ultimo_nome" type="text" required
                                       autocomplete="family-name" placeholder="Ex.: Baptista"
                                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                              outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                            </div>

                            <div>
                                <label for="paciente_data_nascimento" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Data de nascimento <span class="text-red-500">*</span>
                                </label>
                                <input id="paciente_data_nascimento" name="paciente_data_nascimento" type="date" required
                                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                              outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                            </div>

                            <div>
                                <label for="paciente_sexo" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Género <span class="text-red-500">*</span>
                                </label>
                                <select id="paciente_sexo" name="paciente_sexo" required
                                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-white text-sm text-gray-800
                                               outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                                    <option value="">Seleccione o género</option>
                                    <option value="M">Masculino</option>
                                    <option value="F">Feminino</option>
                                </select>
                            </div>

                            <div>
                                <label for="paciente_estado_civil" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Estado Civil
                                </label>
                                <select id="paciente_estado_civil" name="paciente_estado_civil"
                                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-white text-sm text-gray-800
                                               outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                                    <option value="">Seleccione</option>
                                    <option value="SOL">Solteiro(a)</option>
                                    <option value="CAS">Casado(a)</option>
                                    <option value="DIV">Divorciado(a)</option>
                                    <option value="VIU">Viúvo(a)</option>
                                    <option value="UNI">União de Facto</option>
                                </select>
                            </div>

                            <div>
                                <label for="paciente_nacionalidade" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Nacionalidade
                                </label>
                                <input id="paciente_nacionalidade" name="paciente_nacionalidade" type="text"
                                       value="Angolana"
                                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                              outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                            </div>

                            <div>
                                <label for="paciente_profissao" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Profissão
                                </label>
                                <input id="paciente_profissao" name="paciente_profissao" type="text"
                                       placeholder="Ex.: Enfermeiro(a)"
                                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                              outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                            </div>

                            <div>
                                <label for="paciente_bi" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Bilhete de Identidade
                                </label>
                                <input id="paciente_bi" name="paciente_bi" type="text" autocomplete="off"
                                       placeholder="Número do BI"
                                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                              outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                            </div>

                            <div>
                                <label for="paciente_contacto" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Contacto
                                </label>
                                <input id="paciente_contacto" name="paciente_contacto" type="tel" autocomplete="tel"
                                       placeholder="+244 9XX XXX XXX"
                                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                              outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                            </div>

                            <div class="sm:col-span-2">
                                <label for="paciente_fotografia" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Fotografia
                                </label>
                                <input id="paciente_fotografia" name="paciente_fotografia" type="file" accept="image/*"
                                       class="w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-xl
                                              file:border-0 file:text-sm file:font-medium file:bg-orange-50 file:text-orange-600
                                              hover:file:bg-orange-100">
                                <p id="paciente_fotografia_atual" class="text-xs text-gray-400 mt-1 hidden"></p>
                            </div>

                        </div>
                    </div>

                    <!-- ---------- ENDEREÇO ---------- -->
                    <div class="border-t border-gray-100 pt-6">
                        <h3 class="text-base font-semibold text-gray-800 mb-4">Endereço</h3>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5">

                            <div>
                                <label for="paciente_provincia" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Província
                                </label>
                                <input id="paciente_provincia" name="paciente_provincia" type="text"
                                       placeholder="Ex.: Luanda"
                                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                              outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                            </div>

                            <div>
                                <label for="paciente_municipio" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Município
                                </label>
                                <input id="paciente_municipio" name="paciente_municipio" type="text"
                                       placeholder="Ex.: Belas"
                                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                              outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                            </div>

                            <div>
                                <label for="paciente_comuna" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Comuna
                                </label>
                                <input id="paciente_comuna" name="paciente_comuna" type="text"
                                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                              outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                            </div>

                            <div>
                                <label for="paciente_bairro" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Bairro
                                </label>
                                <input id="paciente_bairro" name="paciente_bairro" type="text"
                                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                              outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                            </div>

                            <div>
                                <label for="paciente_rua" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Rua
                                </label>
                                <input id="paciente_rua" name="paciente_rua" type="text"
                                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                              outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                            </div>

                            <div>
                                <label for="paciente_numero_casa" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Número
                                </label>
                                <input id="paciente_numero_casa" name="paciente_numero_casa" type="text"
                                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                              outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                            </div>

                            <div class="sm:col-span-2">
                                <label for="paciente_referencia" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Ponto de referência
                                </label>
                                <textarea id="paciente_referencia" name="paciente_referencia" rows="2"
                                          placeholder="Ex.: Perto do mercado municipal"
                                          class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                                 outline-none resize-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition"></textarea>
                            </div>

                        </div>
                    </div>

                    <!-- ---------- ENTIDADE VINCULADA (UI apenas, ainda não enviado ao backend) ---------- -->
                    <div class="border border-orange-200 border-dashed rounded-2xl p-4 sm:p-5 bg-orange-50/20 relative">
                        <div class="flex items-center gap-2 mb-1">
                            <i class="fa-solid fa-hospital text-orange-600 text-lg"></i>
                            <h3 class="text-orange-600 font-semibold text-base">Entidade Vinculada</h3>
                        </div>
                        <p class="text-xs text-gray-500 mb-3">
                            Associe o paciente a uma Empresa, Seguradora, Médico ou Colaborador
                        </p>
                        <div class="relative flex items-center">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 text-gray-400"></i>
                            <input autocomplete="off" id="inputPesquisaEntidade"
                                   placeholder="Pesquisar Empresa, Seguradora, Médico ou Colaborador" type="text"
                                   class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-100 bg-white
                                          focus:border-orange-500 outline-none text-sm placeholder:text-gray-400 shadow-xs">
                        </div>
                        <div id="dropdownEntidades"
                             class="absolute left-4 right-4 sm:left-5 sm:right-5 mt-1 bg-white border border-gray-200 rounded-xl
                                    shadow-lg max-h-48 overflow-y-auto z-20 hidden"></div>
                        <!-- Ainda sem model/backend: campo NÃO é enviado no fetch (ver views.py) -->
                        <input id="entidadeSelecionada" name="entidadeSelecionada" type="hidden">
                    </div>

                </div>

                <!-- ============================================= -->
                <!-- ABA: RESPONSÁVEL -->
                <!-- ============================================= -->

                <div id="formResponsavel" class="hidden space-y-6">

                    <div>
                        <h3 class="text-base font-semibold text-gray-800 mb-1">Responsável pelo paciente</h3>
                        <p class="text-sm text-gray-500 mb-4">Preencha estes dados quando existir um responsável.</p>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5">

                            <div class="sm:col-span-2">
                                <label for="responsavel_nome" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Nome completo
                                </label>
                                <input id="responsavel_nome" name="responsavel_nome" type="text"
                                       placeholder="Nome do responsável"
                                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                              outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                            </div>

                            <div>
                                <label for="responsavel_parentesco" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Parentesco
                                </label>
                                <select id="responsavel_parentesco" name="responsavel_parentesco"
                                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-white text-sm text-gray-800
                                               outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                                    <option value="">Seleccione</option>
                                    <option value="PAI">Pai</option>
                                    <option value="MAE">Mãe</option>
                                    <option value="FILHO">Filho(a)</option>
                                    <option value="CONJUGE">Cônjuge</option>
                                    <option value="IRMAO">Irmão/Irmã</option>
                                    <option value="TUTOR">Tutor</option>
                                    <option value="OUTRO">Outro</option>
                                </select>
                            </div>

                            <div>
                                <label for="responsavel_contacto" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Contacto
                                </label>
                                <input id="responsavel_contacto" name="responsavel_contacto" type="tel"
                                       placeholder="+244 9XX XXX XXX"
                                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                              outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition">
                            </div>

                            <div class="sm:col-span-2">
                                <label for="responsavel_endereco" class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Endereço
                                </label>
                                <textarea id="responsavel_endereco" name="responsavel_endereco" rows="3"
                                          placeholder="Morada / endereço do responsável"
                                          class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-800
                                                 outline-none resize-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 transition"></textarea>
                            </div>

                        </div>
                    </div>

                </div>

                <!-- ================================================= -->
                <!-- RODAPÉ -->
                <!-- ================================================= -->

                <div class="flex flex-col-reverse sm:flex-row sm:justify-end items-stretch sm:items-center
                            gap-3 pt-5 border-t border-gray-100">

                    <button type="button" onclick="fecharModal()"
                            class="w-full sm:w-auto px-5 py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium
                                   hover:bg-gray-50 transition">
                        Cancelar
                    </button>

                    <button type="submit" id="btnSalvarPaciente"
                            class="flex items-center gap-2 bg-[#F36A2D] text-white hover:opacity-90 px-5 py-2 rounded-full font-medium text-sm transition shadow-sm">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span id="btnSalvarPacienteTexto">Cadastrar Paciente</span>
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- Toast: usa o elemento global #app-toast já existente no layout principal
     (ver app.js) — não é criado outro aqui para evitar dois sistemas de toast. -->
