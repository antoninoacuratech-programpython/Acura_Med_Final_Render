{% load static %}
<section class="panel" id="conveniosPanel">
<div class="flex-1 flex flex-col h-full bg-[#C4C5E0]">
<div class="grid grid-cols-2 gap-6 mb-8">
<div class="bg-white rounded-2xl p-5 shadow-sm flex items-center justify-between">
<div>
<p class="text-xs text-gray-500 font-medium mb-1">Convênios Ativos</p>
<h3 class="text-2xl font-bold text-gray-800">6</h3>
</div>
<div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg shadow-inner">
<i class="fa-solid fa-handshake"></i>
</div>
</div>
<div class="bg-white rounded-2xl p-5 shadow-sm flex items-center justify-between">
<div>
<p class="text-xs text-gray-500 font-medium mb-1">Guias Autorizadas</p>
<h3 class="text-2xl font-bold text-gray-800">215</h3>
</div>
<div class="w-12 h-12 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center text-lg shadow-inner">
<i class="fa-solid fa-file-shield"></i>
</div>
</div>
</div>
<div class="bg-white rounded-3xl p-6 shadow-sm flex-1 flex flex-col">
<div class="flex items-center justify-between mb-6">
<h3 class="text-lg font-bold text-gray-800">Convênios e Validação de Guias</h3>
<button class="flex items-center gap-2 bg-[#F36A2D] text-white hover:opacity-90 px-5 py-2 rounded-full font-medium text-sm transition shadow-sm" onclick="openConvenioModal()">
<i class="fa-solid fa-circle-plus"></i>
<span>Registar Convênio</span>
</button>
</div>
<div class="overflow-x-auto flex-1">
<table class="w-full text-left border-collapse">
<thead>
<tr class="border-b border-gray-100">
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                                        Empresa / Seguradora</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                                        Tipo de Plano</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider text-right">
                                        Ações</th>
</tr>
</thead>
<tbody class="divide-y divide-gray-50 text-sm text-gray-700">
<tr class="hover:bg-gray-50/50 transition">
<td class="py-4 px-4 font-medium">Global Health Seguros</td>
<td class="py-4 px-4 text-gray-500">Plano Saúde Premium</td>
<td class="py-4 px-4 text-right">
<button class="text-blue-600 hover:underline text-xs font-medium">Gerir
                                            Guias</button>
</td>
</tr>
</tbody>
</table>
</div>
</div>
</div>
</section>

{% include 'convenios/modais.html' %}
