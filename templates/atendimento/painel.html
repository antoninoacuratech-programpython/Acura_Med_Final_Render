{% load static %}
<section class="panel" id="atendimentosPanel">
<div class="flex-1 flex flex-col h-full bg-[#C4C5E0]">
<!-- STATS CARDS GRID -->
<div class="grid grid-cols-4 gap-6 mb-8">
<div class="bg-white rounded-2xl p-5 shadow-sm flex items-center justify-between">
<div>
<p class="text-xs text-gray-500 font-medium mb-1">Aguardando</p>
<h3 class="text-2xl font-bold text-gray-800" id="stat-aguardando">—</h3>
</div>
<div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-500 flex items-center justify-center text-lg shadow-inner">
<i class="fa-solid fa-user-clock"></i>
</div>
</div>
<div class="bg-white rounded-2xl p-5 shadow-sm flex items-center justify-between">
<div>
<p class="text-xs text-gray-500 font-medium mb-1">Em Atendimento</p>
<h3 class="text-2xl font-bold text-gray-800" id="stat-em-atendimento">—</h3>
</div>
<div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-500 flex items-center justify-center text-lg shadow-inner">
<i class="fa-solid fa-stethoscope"></i>
</div>
</div>
<div class="bg-white rounded-2xl p-5 shadow-sm flex items-center justify-between">
<div>
<p class="text-xs text-gray-500 font-medium mb-1">Concluídos Hoje</p>
<h3 class="text-2xl font-bold text-gray-800" id="stat-concluidos">—</h3>
</div>
<div class="w-12 h-12 rounded-xl bg-teal-50 text-teal-500 flex items-center justify-center text-lg shadow-inner">
<i class="fa-solid fa-check"></i>
</div>
</div>
<div class="bg-white rounded-2xl p-5 shadow-sm flex items-center justify-between">
<div>
<p class="text-xs text-gray-500 font-medium mb-1">Aguardando Chegada</p>
<h3 class="text-2xl font-bold text-gray-800" id="stat-aguardando-chegada">—</h3>
</div>
<div class="w-12 h-12 rounded-xl bg-pink-50 text-pink-500 flex items-center justify-center text-lg shadow-inner">
<i class="fa-regular fa-calendar-days"></i>
</div>
</div>
</div>
<!-- FILA -->
<div class="bg-white rounded-3xl p-6 shadow-sm">
<div class="flex items-center justify-between mb-6">
<h3 class="text-lg font-bold text-gray-800">Fila de Atendimento</h3>
<div class="flex items-center gap-4">
<div class="relative w-64">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
<i class="fa-solid fa-magnifying-glass text-xs"></i>
</span>
<input class="w-full h-10 pl-10 pr-4 bg-gray-50 border border-gray-200 rounded-full text-sm text-gray-700 focus:outline-none focus:border-[#F36A2D]" id="input-search-fila" oninput="filterFilaAtendimento(this.value)" placeholder="Pesquisa" type="text"/>
</div>
<button class="flex items-center justify-center gap-2 h-10 bg-[#F36A2D] text-white hover:opacity-60 px-5 rounded-full font-medium text-sm transition shadow-sm" onclick="openAtendimentoModal()">
<i class="fa-solid fa-circle-plus"></i>
<span>Adicionar</span>
</button>
</div>
</div>
<div class="overflow-x-auto">
<table class="w-full text-left border-collapse">
<thead>
<tr class="border-b border-gray-100">
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Paciente</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Profissional</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Prioridade</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">Estado</th>
<th class="py-3 px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider text-right">Ação</th>
</tr>
</thead>
<tbody class="divide-y divide-gray-50 text-sm text-gray-700" id="fila-atendimento-body">
<tr><td class="py-6 px-4 text-center text-gray-400" colspan="5">A carregar...</td></tr>
</tbody>
</table>
</div>
</div>
</div>
</section>

{% include 'atendimento/modais.html' %}
